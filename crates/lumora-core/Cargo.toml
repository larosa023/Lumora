[package]
name = "lumora-core"
description = "Lumora's RGB engine: OpenRGB SDK client, effects and profiles"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Real USB HID access for coolers (the app turns this on; tests use a fake).
hid = ["dep:hidapi"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
libloading = "0.8"
hidapi = { version = "2.6", optional = true, default-features = false, features = ["linux-native-basic-udev", "windows-native", "macos-shared-device"] }
