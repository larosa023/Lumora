[package]
name = "lumora-sensors"
description = "Lumora's CPU temperature helper for Windows (runs with admin rights, read-only)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lumora-sensors"
path = "src/main.rs"

[dependencies]
# The cooler relay (Corsair Hydro Pro through UsbDk, which needs admin rights).
lumora-core = { path = "../lumora-core", features = ["usb"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
