[workspace]
resolver = "2"
members = ["crates/lumora-core", "src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/larosa023/lumora"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small, fast binary.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
