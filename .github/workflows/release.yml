# Builds Lumora for Windows, macOS and Linux and publishes a GitHub Release.
# The release includes a signed latest.json, which is what the in-app updater
# reads, so every installed copy offers the new version automatically.
#
# Start a release either way:
#   - GitHub: Actions → Release → Run workflow. It publishes the version in
#     src-tauri/tauri.conf.json and creates the tag for you.
#   - Terminal: npm run release -- 0.2.0   (bumps, commits, tags, pushes)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Bundle the hardware engine (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-engine.ps1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          # __VERSION__ is filled in from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: 'Lumora v__VERSION__'
          releaseBody: 'New here? Download the installer for your system below (Windows: the .exe). Already have Lumora? It offers this update on its own.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Attach OpenRGB source (GPL)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $engine = (Get-Content src-tauri/engine/VERSION).Split('-')[0]
          Invoke-WebRequest -Uri "https://codeberg.org/OpenRGB/OpenRGB/archive/release_$engine.tar.gz" -OutFile "OpenRGB-$engine-source.tar.gz"
          gh release upload "v$version" "OpenRGB-$engine-source.tar.gz" --clobber
