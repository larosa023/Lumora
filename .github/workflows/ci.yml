name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Engine tests (uses a fake OpenRGB server)
        run: cargo test -p lumora-core
      - name: App builds
        run: cargo build -p lumora
      - name: UI scripts parse
        run: for f in ui/js/*.js scripts/*.mjs; do node --check "$f"; done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Bundle the hardware engine
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-engine.ps1
      - name: App builds on Windows
        run: cargo build -p lumora
      - name: CPU temperature helper builds
        run: cargo build -p lumora-sensors && cargo test -p lumora-sensors
      - name: USBXpress companion builds (32-bit)
        run: rustup target add i686-pc-windows-msvc && cargo build -p lumora-usbxpress --target i686-pc-windows-msvc
      - name: Windows unit tests
        run: cargo test -p lumora

  real-openrgb:
    continue-on-error: true
    # Talks to a real OpenRGB server (no hardware, so zero devices) to catch
    # protocol changes in new OpenRGB releases.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Start OpenRGB headless
        run: |
          curl -fsSL -o OpenRGB.AppImage https://codeberg.org/OpenRGB/OpenRGB/releases/download/release_1.1/OpenRGB_1.1_x86_64_8e16de2.AppImage
          chmod +x OpenRGB.AppImage && ./OpenRGB.AppImage --appimage-extract > /dev/null
          mkdir -p "$RUNNER_TEMP/orgb"
          QT_QPA_PLATFORM=offscreen ./squashfs-root/AppRun --server --server-host 127.0.0.1 --server-port 6742 --noautoconnect --config "$RUNNER_TEMP/orgb" -v > openrgb.log 2>&1 || echo "OpenRGB exited with $?" >> openrgb.log &
      - name: Lumora's client connects
        run: |
          set -o pipefail
          cargo build -q -p lumora-core --example probe
          ./target/debug/examples/probe 2>&1 | tee probe.log
      - name: Report (readable as check annotations)
        if: always()
        run: |
          sed 's/^/probe: /' probe.log 2>/dev/null | tail -40 | while IFS= read -r l; do echo "::notice::$l"; done
          tail -30 openrgb.log 2>/dev/null | sed 's/^/openrgb: /' | while IFS= read -r l; do echo "::notice::$l"; done
          ls -la squashfs-root/AppRun 2>&1 | sed 's/^/files: /' | while IFS= read -r l; do echo "::notice::$l"; done
